// Secundário de sd.lab — ns2.sd.lab (10.53.0.31)
// Não tem arquivo de zona: recebe tudo do primário por transferência (AXFR/IXFR)
// e mantém só em memória. Ao reiniciar, precisa transferir de novo.
options {
    directory "/var/cache/bind";
    pid-file none;
    listen-on { any; };
    listen-on-v6 { none; };
    recursion no;
    allow-query { any; };
    dnssec-validation no;
    querylog yes;
    version "dns-lab";
};

zone "sd.lab" {
    type secondary;
    primaries { 10.53.0.30; };
    allow-transfer { 10.53.0.100; };
};

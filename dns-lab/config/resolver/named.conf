// Resolvedor recursivo — 10.53.0.53
// Resolve iterativamente a partir da NOSSA raiz (root hints) e guarda tudo em cache.
options {
    directory "/var/cache/bind";
    pid-file none;
    listen-on { any; };
    listen-on-v6 { none; };
    recursion yes;
    allow-query { 10.53.0.0/24; 127.0.0.1; };
    allow-recursion { 10.53.0.0/24; 127.0.0.1; };

    // A raiz fictícia não é assinada. Com a validação ligada (padrão "auto"),
    // o BIND usaria a âncora da raiz REAL e tudo daria SERVFAIL.
    dnssec-validation no;

    prefetch 0;               // sem renovação antecipada: o TTL expira "limpo" na demonstração
    max-cache-size 32M;       // cabe com folga no limite de 128M do contêiner
    querylog yes;
    version "dns-lab";
};

zone "." {
    type hint;
    file "/var/lib/bind/db.root.hints";
};

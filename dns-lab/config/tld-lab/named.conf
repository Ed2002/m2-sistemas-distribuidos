// Servidor do TLD .lab — ns1.nic.lab (10.53.0.20)
// Autoritativo para "lab" e delega "sd.lab" para ns1/ns2.sd.lab (com glue).
options {
    directory "/var/cache/bind";
    pid-file none;
    listen-on { any; };
    listen-on-v6 { none; };
    recursion no;
    allow-query { any; };
    allow-transfer { none; };
    dnssec-validation no;
    querylog yes;
    version "dns-lab";
};

zone "lab" {
    type primary;
    file "/var/lib/bind/db.lab";
};

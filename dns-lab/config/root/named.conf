// Servidor RAIZ fictício — a.root-servers.lab (10.53.0.10)
// Autoritativo para "." e só sabe uma coisa: quem responde por .lab (delegação + glue).
options {
    directory "/var/cache/bind";
    pid-file none;
    listen-on { any; };
    listen-on-v6 { none; };
    recursion no;              // autoritativo puro: não resolve nada para ninguém
    allow-query { any; };
    allow-transfer { none; };
    dnssec-validation no;
    querylog yes;              // cada consulta recebida aparece em `docker compose logs root`
    version "dns-lab";
};

zone "." {
    type primary;
    file "/var/lib/bind/db.root";
};

// Primário de sd.lab — ns1.sd.lab (10.53.0.30)
// Fonte da verdade da zona; avisa o secundário (NOTIFY) quando o serial muda.
options {
    directory "/var/cache/bind";
    pid-file none;
    listen-on { any; };
    listen-on-v6 { none; };
    recursion no;
    allow-query { any; };
    dnssec-validation no;
    querylog yes;
    version "dns-lab";
};

zone "sd.lab" {
    type primary;
    file "/var/lib/bind/db.sd.lab";
    notify yes;                                  // avisa os NS da zona (ns2 = 10.53.0.31)
    ixfr-from-differences yes;                   // ao recarregar, guarda só a diferença -> secundário usa IXFR
    allow-transfer { 10.53.0.31; 10.53.0.100; }; // secundário + cliente (para demonstrar AXFR)
};
